<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LittleBigSnake - Проверка серверов</title>
  <link rel="icon" type="image/png" href="assets/mobile-header-logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <img src="assets/mobile-header-logo.png" alt="LITTLE BIG SNAKE" id="logo">
  </header>

  <main>
    <div id="start-screen" class="center">
      <button id="btn-start" class="btn-start">НАЧАТЬ</button>
      <div id="master-status" style="display:none"></div>
    </div>

    <div id="servers-section" hidden>
      
      <div class="actions">
        <button id="btn-check-all" class="btn-action">проверить все сервера</button>
      </div><div id="servers" class="servers-grid"></div>

    </div>
  </main>

  <script>
    // show status box once start is pressed
    const btnStart = document.getElementById('btn-start');
    const statusBox = document.getElementById('master-status');
    btnStart.addEventListener('click', ()=> { statusBox.style.display='block'; }, {once:true});
  </script>
  <script src="script.js"></script>
</body>
</html>
